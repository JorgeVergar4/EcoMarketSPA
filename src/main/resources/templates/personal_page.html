<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Personal - EcoMarketSPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #03a9f4;
            --secondary-color: #ff4987;
            --background-color: #f4f7f6;
        }

        body {
            background-color: var(--background-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .welcome-section {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .search-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .product-card {
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .nav-link {
            color: var(--primary-color);
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
    <div class="container">
        <a class="navbar-brand" href="#">EcoMarketSPA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/productos"><i class="fas fa-box"></i> Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/perfil"><i class="fas fa-user"></i> Perfil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Sección de bienvenida -->
<div class="welcome-section">
    <div class="container">
        <h1 class="display-4">Bienvenido, <span th:text="${userLogin}">Usuario</span>!</h1>
        <p class="lead">¿Qué estás buscando hoy?</p>
    </div>
</div>

<!-- Contenido principal -->
<div class="container">
    <!-- Buscador -->
    <div class="search-box">
        <form action="/buscar" method="get" class="row g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Buscar productos..." name="q">
                    <button class="btn btn-primary" type="submit">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </div>
            <div class="col-md-6">
                <select class="form-select" name="categoria">
                    <option value="">Todas las categorías</option>
                    <option value="1">Categoría 1</option>
                    <option value="2">Categoría 2</option>
                    <option value="3">Categoría 3</option>
                </select>
            </div>
        </form>
    </div>

    <!-- Productos destacados -->
    <h2 class="mb-4">Productos destacados</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- Repetir para cada producto -->
        <div class="col" th:each="product : ${featuredProducts}">
            <div class="card h-100 product-card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.nombre}">Nombre del Producto</h5>
                    <p class="card-text" th:text="${product.descripcion}">Descripción del producto</p>
                    <p class="card-text">
                        <span class="text-primary fw-bold" th:text="${'$' + product.precio}">$0.00</span>
                    </p>
                    <button class="btn btn-outline-primary">Ver detalles</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light mt-5 py-3">
    <div class="container text-center">
        <p>&copy; 2025 EcoMarketSPA. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
