<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Agregar Producto - EcoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<section class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h2>Agregar Producto</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/productos/agregar}" method="post" th:object="${productRequest}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Producto</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required />
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="3" th:field="*{descripcion}" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="precio" th:field="*{precio}" min="0" step="0.01" required />
                        </div>

                        <div class="mb-3">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="stock" th:field="*{stock}" min="0" required />
                        </div>

                        <fieldset class="mb-3">
                            <legend class="form-label">Estado</legend>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{estado}" value="true" id="activo" checked />
                                <label class="form-check-label" for="activo">Activo</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{estado}" value="false" id="inactivo" />
                                <label class="form-check-label" for="inactivo">Inactivo</label>
                            </div>
                        </fieldset>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Guardar Producto</button>
                            <a href="/productos" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
