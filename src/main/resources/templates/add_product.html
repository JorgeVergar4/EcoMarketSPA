<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto - EcoMarket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container glass-effect">
    <header>
        <h1><i class="fas fa-plus-circle eco-icon"></i>Agregar Nuevo Producto</h1>
    </header>

    <form th:action="@{/productos/agregar}" method="post" th:object="${productRequest}" class="glass-effect">
        <div class="form-group">
            <label for="nombre_producto">
                <i class="fas fa-tag eco-icon"></i>Nombre del Producto
            </label>
            <input type="text" id="nombre_producto" th:field="*{nombre}" required>
        </div>

        <div class="form-group">
            <label for="descripcion">
                <i class="fas fa-align-left eco-icon"></i>Descripción
            </label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="precio">
                <i class="fas fa-dollar-sign eco-icon"></i>Precio
            </label>
            <input type="number" id="precio" th:field="*{precio}" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="stock">
                <i class="fas fa-boxes eco-icon"></i>Stock
            </label>
            <input type="number" id="stock" th:field="*{stock}" min="0" required>
        </div>

        <div class="form-group">
            <label class="radio-label">
                <i class="fas fa-toggle-on eco-icon"></i>Estado
            </label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="activo" th:field="*{estado}" value="true" checked>
                    <label for="activo">
                        <i class="fas fa-check-circle"></i> Activo
                    </label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="inactivo" th:field="*{estado}" value="false">
                    <label for="inactivo">
                        <i class="fas fa-times-circle"></i> Inactivo
                    </label>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save eco-icon"></i>Guardar Producto
            </button>
            <a href="/productos" class="btn btn-secondary">
                <i class="fas fa-arrow-left eco-icon"></i>Cancelar
            </a>
        </div>
    </form>
</div>
</body>
</html>
