<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container glass-effect">
    <header>
        <h1><i class="fas fa-user-edit eco-icon"></i>Editar Usuario</h1>
    </header>

    <form th:action="@{/edit}" method="post" th:object="${user}" class="glass-effect">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="login">
                <i class="fas fa-user eco-icon"></i>Nombre de Usuario
            </label>
            <input type="text" id="login" th:field="*{login}" required>
        </div>

        <div class="form-group">
            <label for="email">
                <i class="fas fa-envelope eco-icon"></i>Email
            </label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="password">
                <i class="fas fa-key eco-icon"></i>Contraseña
            </label>
            <input type="password" id="password" th:field="*{password}">
            <small class="form-text">Dejar en blanco para mantener la contraseña actual</small>
        </div>

        <div class="form-group">
            <label for="address">
                <i class="fas fa-map-marker-alt eco-icon"></i>Dirección
            </label>
            <input type="text" id="address" th:field="*{address}">
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save eco-icon"></i>Guardar Cambios
            </button>
            <a href="/users" class="btn btn-secondary">
                <i class="fas fa-arrow-left eco-icon"></i>Cancelar
            </a>
        </div>
    </form>
</div>
</body>
</html>
