<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Lista de Productos</h2>

    <!-- Mensajes -->
    <div th:if="${session.succMsg}" class="alert alert-success" th:text="${session.succMsg}"></div>
    <div th:if="${session.errorMsg}" class="alert alert-danger" th:text="${session.errorMsg}"></div>

    <!-- Tabla de productos -->
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.nombre}">Nombre</td>
            <td th:text="${product.descripcion}">Descripción</td>
            <td th:text="${product.precio}">$0.00</td>
            <td th:text="${product.stock}">0</td>
            <td>
                <span class="badge bg-success" th:if="${product.estado}">Activo</span>
                <span class="badge bg-secondary" th:unless="${product.estado}">Inactivo</span>
            </td>
            <td>
                <a th:href="@{'/productos/editar/' + ${product.id}}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{'/productos/eliminar/' + ${product.id}}"
                   onclick="return confirm('¿Estás seguro de eliminar este producto?');"
                   class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-4">
        <a href="/productos/agregar" class="btn btn-primary">Agregar nuevo producto</a>
        <a href="/" class="btn btn-secondary">Volver a inicio</a>
    </div>
</div>
</body>
</html>
