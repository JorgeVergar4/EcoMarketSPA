<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - EcoMarket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container glass-effect">
    <header>
        <h1><i class="fas fa-sign-in-alt eco-icon"></i>Iniciar Sesión</h1>
    </header>

    <form th:action="@{/login}" method="post" th:object="${loginRequest}" class="glass-effect">
        <div class="form-group">
            <label for="login">
                <i class="fas fa-user eco-icon"></i>Usuario
            </label>
            <input type="text" id="login" th:field="*{login}" required>
        </div>

        <div class="form-group">
            <label for="password">
                <i class="fas fa-lock eco-icon"></i>Contraseña
            </label>
            <input type="password" id="password" th:field="*{password}" required>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt eco-icon"></i>Entrar
            </button>
            <a href="/" class="btn btn-secondary">
                <i class="fas fa-arrow-left eco-icon"></i>Volver
            </a>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            Usuario o contraseña incorrectos
        </div>
    </form>

    <div class="text-center mt-4">
        <p>¿No tienes una cuenta?</p>
        <a href="/register" class="btn btn-outline">
            <i class="fas fa-user-plus eco-icon"></i>Registrarse
        </a>
    </div>
</div>
</body>
</html>
