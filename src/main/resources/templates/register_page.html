<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - EcoMarket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container glass-effect">
    <header>
        <h1><i class="fas fa-user-plus eco-icon"></i>Registro</h1>
    </header>

    <form th:action="@{/register}" method="post" th:object="${registerRequest}" class="glass-effect">
        <div class="form-group">
            <label for="login">
                <i class="fas fa-user eco-icon"></i>Usuario
            </label>
            <input type="text" id="login" th:field="*{login}" required>
        </div>

        <div class="form-group">
            <label for="password">
                <i class="fas fa-lock eco-icon"></i>Contraseña
            </label>
            <input type="password" id="password" th:field="*{password}" required>
        </div>

        <div class="form-group">
            <label for="email">
                <i class="fas fa-envelope eco-icon"></i>Correo Electrónico
            </label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="address">
                <i class="fas fa-map-marker-alt eco-icon"></i>Dirección
            </label>
            <input type="text" id="address" th:field="*{address}" required>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-user-plus eco-icon"></i>Registrarse
            </button>
            <a href="/" class="btn btn-secondary">
                <i class="fas fa-arrow-left eco-icon"></i>Volver
            </a>
        </div>
    </form>
</div>
</body>
</html>
