<!-- src/main/resources/templates/register_page.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <style>
        body {
            background-color: #f0fff0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: #e0f7e9;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 128, 0, 0.2);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #2e7d32;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #2e7d32;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 5px;
            border: 1px solid #a5d6a7;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #43a047;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body><form th:action="@{/register}" method="post" th:object="${registerRequest}">
    <h2>Registro</h2>

    <label>Usuario</label>
    <input type="text" th:field="*{login}" required>
    <span th:if="${#fields.hasErrors('login')}" th:errors="*{login}" class="error"></span>

    <label>Contraseña</label>
    <input type="password" th:field="*{password}" required>
    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>

    <label>Correo electrónico</label>
    <input type="email" th:field="*{email}" required>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>

    <label>Dirección</label>
    <input type="text" th:field="*{address}" required>
    <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error"></span>

    <button type="submit">Registrarse</button>
    <button type="/">Volver a la pagina principal</button>
</form>

</body>
</html>
