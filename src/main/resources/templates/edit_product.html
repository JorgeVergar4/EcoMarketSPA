<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Producto</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container glass-effect">
  <header>
    <h1><i class="fas fa-edit eco-icon"></i>Editar Producto</h1>
  </header>

  <form th:action="@{/productos/editar}" method="post" th:object="${product}" class="glass-effect">
    <input type="hidden" th:field="*{id}">

    <div class="form-group">
      <label for="nombre">
        <i class="fas fa-tag eco-icon"></i>Nombre del Producto
      </label>
      <input type="text" id="nombre" th:field="*{nombre}" required>
    </div>

    <div class="form-group">
      <label for="descripcion">
        <i class="fas fa-align-left eco-icon"></i>Descripción
      </label>
      <textarea id="descripcion" th:field="*{descripcion}" rows="3" required></textarea>
    </div>

    <div class="form-group">
      <label for="precio">
        <i class="fas fa-dollar-sign eco-icon"></i>Precio
      </label>
      <input type="number" id="precio" th:field="*{precio}" step="0.01" required>
    </div>

    <div class="form-group">
      <label for="stock">
        <i class="fas fa-boxes eco-icon"></i>Stock
      </label>
      <input type="number" id="stock" th:field="*{stock}" required>
    </div>

    <div class="form-group">
      <label for="estado">
        <i class="fas fa-toggle-on eco-icon"></i>Estado
      </label>
      <select id="estado" th:field="*{estado}">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save eco-icon"></i>Guardar Cambios
      </button>
      <a href="/productos" class="btn btn-secondary">
        <i class="fas fa-arrow-left eco-icon"></i>Cancelar
      </a>
    </div>
  </form>
</div>
</body>
</html>
